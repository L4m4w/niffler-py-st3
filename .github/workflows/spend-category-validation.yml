name: Spend category validation regression

on:
  pull_request:

permissions:
  contents: read

jobs:
  spend-category-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run spend category validation regression test
        working-directory: .
        run: ./gradlew :niffler-gateway:test --tests 'guru.qa.niffler.controller.SpendControllerValidationTest'
